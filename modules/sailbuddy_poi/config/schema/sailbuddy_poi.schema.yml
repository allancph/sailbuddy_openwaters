sailbuddy_poi.settings:
  type: config_object
  label: 'Sailbuddy POI settings'
  mapping:
    api_key_key:
      type: string
      label: 'Key module ID holding the ActiveCaptain API key'
    environment:
      type: string
      label: 'Garmin environment (stage or production)'
    zoom_min:
      type: integer
      label: 'Minimum map zoom at which POI icons are shown'
    cache_ttl:
      type: integer
      label: 'Cache lifetime in seconds for bbox responses'
    endpoint_stage:
      type: string
      label: 'Staging bbox API endpoint'
    endpoint_production:
      type: string
      label: 'Production bbox API endpoint'
    webview_stage:
      type: string
      label: 'Staging POI webview base URL'
    webview_production:
      type: string
      label: 'Production POI webview base URL'
    providers_enabled:
      type: sequence
      label: 'Enabled POI providers'
      sequence:
        type: string
        label: 'Provider plugin id'
    overpass_endpoint:
      type: string
      label: 'Overpass API endpoint'
    overpass_tags:
      type: sequence
      label: 'Overpass tag filters (key=value)'
      sequence:
        type: string
        label: 'Tag filter'