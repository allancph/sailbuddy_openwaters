sailbuddy_map.init:
  css:
    theme:
      css/sailbuddy_map.css: {}
  js:
    js/sailbuddy_map.js: {}
  dependencies:
    - leaflet/leaflet
    - leaflet/maplibre-gl-js

sailbuddy_map.overlays:
  js:
    js/sailbuddy-map-overlays.js: {}
  dependencies:
    - leaflet/leaflet-drupal
    - core/drupalSettings
    - core/once
    - sailbuddy_map/leaflet-velocity

leaflet-velocity:
