sailbuddy_map.settings:
  type: config_object
  label: 'Sailbuddy Map settings'
  mapping:
    base_style_url:
      type: string
      label: 'Base MapLibre style URL'
    default_tile_url:
      type: string
      label: 'Default XYZ tile URL'
    openwaters_tilejson_url:
      type: string
      label: 'OpenWaters TileJSON URL'
    cache_ttl:
      type: integer
      label: 'Cache TTL'
    center_lat:
      type: float
      label: 'Default center latitude'
    center_lng:
      type: float
      label: 'Default center longitude'
    zoom:
      type: integer
      label: 'Default zoom'
    attribution:
      type: string
      label: 'Default attribution'
    marker_icon_url:
      type: string
      label: 'Marker icon URL'
    enable_seascape:
      type: boolean
      label: 'Enable Seascape overlays'
    enable_tides:
      type: boolean
      label: 'Enable tide predictions'
    tides_units:
      type: string
      label: 'Tide units'
    enable_ais:
      type: boolean
      label: 'Enable AIS traffic'
    ais_refresh:
      type: integer
      label: 'AIS refresh interval'

