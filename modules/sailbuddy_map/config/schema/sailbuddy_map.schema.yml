block.settings.sailbuddy_map_block:
  type: block_settings
  label: 'Sailbuddy Map block'
  mapping:
    use_site_default:
      type: boolean
      label: 'Use site defaults'
    base_style_url:
      type: string
      label: 'Base style URL override'
    tile_url:
      type: string
      label: 'XYZ tile URL override'
    tilejson_url:
      type: string
      label: 'TileJSON URL override'
    center_lat:
      type: float
      label: 'Center latitude'
    center_lng:
      type: float
      label: 'Center longitude'
    zoom:
      type: integer
      label: 'Zoom'
    height:
      type: string
      label: 'Map height'
    enable_seascape:
      type: boolean
      label: 'Enable Seascape overlays'
    enable_tides:
      type: boolean
      label: 'Enable tide predictions'
    tides_units:
      type: string
      label: 'Tide units'
    enable_ais:
      type: boolean
      label: 'Enable AIS traffic'
    ais_refresh:
      type: integer
      label: 'AIS refresh interval'
    enabled_layers:
      type: sequence
      label: 'Enabled layers'
