    height_unit:
      type: string
      label: 'Map height unit'
    fitbounds:
      type: boolean
      label: 'Fit to bounds'
    enable_seascape:
      type: boolean
      label: 'Enable Seascape overlays'
    enable_tides:
      type: boolean
      label: 'Enable tide predictions'
    tides_units:
      type: string
      label: 'Tide units'
    enable_ais:
      type: boolean
      label: 'Enable AIS traffic'
    ais_refresh:
      type: integer
      label: 'AIS refresh interval'

