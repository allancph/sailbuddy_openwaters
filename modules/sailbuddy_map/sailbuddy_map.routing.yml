sailbuddy_map.settings:
  path: '/admin/config/system/sailbuddy-map'
  defaults:
    _form: '\Drupal\sailbuddy_map\Form\SailbuddyMapSettingsForm'
    _title: 'Sailbuddy Map'
  requirements:
    _permission: 'administer site configuration'

sailbuddy_map.style:
  path: '/sailbuddy-map/style/{chart}'
  defaults:
    _controller: '\Drupal\sailbuddy_map\Controller\SailbuddyMapStyleController::build'
    chart: seamap
  requirements:
    _access: 'TRUE'
